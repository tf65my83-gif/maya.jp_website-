<!doctype html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ONLINE SHOP — maya</title>

<style>

*{

  box-sizing:border-box;

}

body{

  margin:0;

  background:#ffffff;

  color:#29271f;

  font-family:Arial,"Hiragino Kaku Gothic ProN",sans-serif;

}

header{

  position:fixed;

  top:0;

  left:0;

  right:0;

  display:flex;

  justify-content:space-between;

  padding:24px 28px;

  z-index:10;

}

header a{

  color:#29271f;

  text-decoration:none;

}

.logo{

  font-size:20px;

  letter-spacing:.25em;

}

main{

  min-height:100vh;

  display:flex;

  align-items:center;

  justify-content:center;

  text-align:center;

  padding:40px;

}

.shop{

  margin-top:-20px;

}

.label{

  font-size:10px;

  letter-spacing:.25em;

  margin-bottom:30px;

}

h1{

  margin:0;

  font-size:clamp(32px,6vw,64px);

  font-weight:400;

  letter-spacing:.08em;

}

.coming{

  margin-top:35px;

  font-size:10px;

  letter-spacing:.25em;

}

.back{

  display:block;

  margin-top:60px;

  color:#29271f;

  text-decoration:none;

  font-size:10px;

  letter-spacing:.18em;

}

</style>

</head>

<body>

<header>

  <a class="logo" href="index.html">maya</a>

</header>

<main>

  <div class="shop">

    <div class="label">ONLINE SHOP</div>

    <h1>COMING SOON</h1>

    <div class="coming">

      ONLINE STORE WILL OPEN SOON.

    </div>

    <a class="back" href="index.html">

      ← HOME

    </a>

  </div>

</main>

</body>

</html>
